[project]
name = "diariestraits"
version = "0.1.0"
description = "AI som kvalitetskontrollant i diariet - hackathon-prototyp"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
